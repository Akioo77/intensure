# Alembic 配置 — intensure
#
# 用法（在 VM 内执行）:
#   export ALEMBIC_DB_URL='postgresql://postgres@/intensure_dev?host=/var/run/postgresql'
#   alembic upgrade head        # 把库升到最新版本
#   alembic current             # 看当前是哪个版本
#   alembic history             # 看版本历史
#   alembic downgrade -1        # 回退一版
#
# 为什么用环境变量而不是写死: 密码不该进版本库；不同环境(本机/VM/CI)DSN 不同。
# DSN 优先级: 环境变量 ALEMBIC_DB_URL > 下面的 sqlalchemy.url
#
# 注意: 本项目**没有 SQLAlchemy 模型**（schema 是手写 SQL + psycopg2），
#       所以不用 autogenerate。改动 schema 的流程是:
#         1. 改 docs/database-schema.sql（规范文件）
#         2. 写一个新的 revision（migrations/versions/xxxx_*.py），
#            里面用 op.get_bind().exec_driver_sql(...) 写增量 DDL
#         3. python3 db_maintenance/gen_baseline.py  # 如果需要重新生成基线
#         4. alembic upgrade head
#         5. bash demo_scripts/verify_fresh_db.sh   # 验证 新建库 == 现有库

[alembic]
script_location = migrations
prepend_sys_path = .
# 留空 —— 实际 DSN 从环境变量 ALEMBIC_DB_URL 取（见 migrations/env.py）
sqlalchemy.url =

# ------------------------------------------------------------------
# logging
# ------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
