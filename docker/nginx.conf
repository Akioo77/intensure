# nginx 配置：静态看板 + 反代采集层 API
#
# 看板（dashboard.html）在浏览器里跑，要调采集层的 API。
# 直接开 8080 会有跨域问题（CORS），这里反代掉 → 浏览器只看得到一个源。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index dashboard.html;

    # 采集层 API 反代（看板里写的是相对路径 /api/...）
    location /api/ {
        proxy_pass http://intensure:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 状态快照可能较大，别截断
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    # OVS 日志端点返回可能很大，放宽
    location /api/ovs/ {
        proxy_pass http://intensure:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # 采集层自带的历史/契约端点同源
    location /metrics {
        proxy_pass http://intensure:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /dashboard.html;
    }
}
