name: CI

# 触发条件: 任何 push / pull_request
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: 单元测试 + 语法检查
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖（核心）
        run: |
          python -m pip install --upgrade pip
          # --break-system-packages 是 Ubuntu 24.04 必需
          pip install --break-system-packages -r requirements.txt

      - name: 安装 Python 依赖（dev，含 pytest）
        run: |
          pip install --break-system-packages -r requirements-dev.txt

      - name: 安装系统依赖（mininet / openvswitch，可选）
        # 这是可选的——CI 跑核心测试不依赖 mininet
        # 如果装失败（包名变化），不影响后续步骤
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y mininet openvswitch-switch
          echo "系统依赖装好（可选）"

      - name: 检查基线与 schema 规范文件一致
        # 不需要数据库 —— 纯文件比对。
        # 改了 docs/database-schema.sql 却忘了重新生成基线, 这里直接失败。
        run: |
          python3 db_maintenance/gen_baseline.py
          git diff --exit-code -- migrations/versions/0001_baseline.py
          echo "基线与规范文件一致"

      - name: Ruff 代码风格检查（防退化）
        run: |
          # ruff 只查不写 —— 格式统一靠 pre-commit 的 ruff --fix。
          # 配置见 pyproject.toml（E402 已豁免: eventlet.monkey_patch 必须在 import 之前）。
          ruff check .
          echo "Ruff OK"

      - name: Python 语法检查
        run: |
          for f in *.py migrations/versions/*.py db_maintenance/*.py; do
            python -m py_compile "$f" || { echo "syntax error: $f"; exit 1; }
          done
          echo "All Python files OK"

      - name: Shell 脚本语法检查
        run: |
          fail=0
          for sh in start_env.sh test_osken.sh demo_scripts/*.sh demo_scripts/lib/*.sh db_maintenance/*.sh; do
            if [ -f "$sh" ]; then
              if bash -n "$sh"; then
                echo "OK: $sh"
              else
                echo "FAIL: $sh"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: 跑单元测试
        run: |
          # 跑全部 pytest 测试文件。
          # 注意: test_recovery.py 是手动脚本(硬编码 VM 路径 + 需要真实 mininet 拓扑),
          #       pytest 收集不到用例且在 CI 会 import 失败, 故排除。
          # test_db_writer.py 的真实库用例在无 PG 时会自动 SKIP, 不影响 CI。
          python -m pytest \
            test_actual_state_builder.py \
            test_reporter.py \
            test_graceful.py \
            test_db_writer.py \
            test_assurance_mvp.py \
            test_state_server.py \
            test_state_history.py \
            test_ovs_logger.py \
            test_state_model.py \
            test_metrics.py \
            test_contract_version.py \
            test_fault_api.py \
            test_contract_api.py \
            test_env_config.py \
            test_env_doctor.py \
            test_exec_target.py \
            test_device_agent.py \
            test_probe_drivers.py \
            test_host_cache.py \
            test_demo_scripts.py \
            -v

      - name: 检查测试文件没有漏进 CI
        # ⚠️ 踩过的坑：新增 test_env_doctor.py 时忘了加进上面的 pytest 列表，
        #    本地 313 例全绿，CI 却压根没跑这个文件 —— **假绿**。
        #    这里做一道机械检查：仓库根目录每个 test_*.py 都必须在 CI 列表里。
        #
        # 豁免名单（EXCLUDE）：不是 pytest 用例的脚本。
        #   test_recovery.py —— 手动脚本，import 时就建 Mininet 拓扑并连控制器，
        #     pytest 一收集就报错（不是用例，是脚本）。
        #     放这里而不是放进 pytest 列表，是有意的。
        run: |
          EXCLUDE="test_recovery.py"
          missing=0
          for f in test_*.py; do
            case " $EXCLUDE " in
              *" $f "*) echo "跳过（手动脚本，不在 CI 跑）: $f"; continue ;;
            esac
            if ! grep -q "$f" .github/workflows/ci.yml; then
              echo "❌ 漏跑: $f —— 请把它加进 CI 的 pytest 列表"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "所有测试文件都在 CI 列表里"
          exit $missing

  docker:
    name: Docker 镜像构建 + 容器起得来
    runs-on: ubuntu-24.04
    # 只在主干与 PR 上跑；构建耗时长，别每条分支都烧
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建镜像
        # ⚠️ PIP_INDEX_URL 要用官方源：GitHub runner 在美国，
        #    清华镜像在境外慢且不稳（本地踩过 pip 传输截断）。
        run: |
          docker build \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            -t intensure:ci .
          echo "镜像构建成功"

      - name: 起容器并验证健康检查
        # 只验证采集层 API（/api/health 不依赖数据库），
        # 所以这里不需要 postgres —— 联调那套三服务栈另有 compose。
        run: |
          docker run -d --name intensure-ci -p 18080:8080 intensure:ci
          for i in $(seq 1 30); do
            if curl -fsS --noproxy '*' http://127.0.0.1:18080/api/health; then
              echo ""
              echo "健康检查通过（第 ${i} 次尝试）"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ 容器 30 次尝试都没健康"
              docker logs intensure-ci
              exit 1
            fi
            sleep 2
          done

      - name: 检查容器内 API 路由可用
        run: |
          for path in /api/state /api/switches /api/hosts /api/capabilities; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --noproxy '*' \
                   "http://127.0.0.1:18080${path}")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "❌ $path 返回 $code"; exit 1; }
          done

      - name: 清理容器
        if: always()
        run: docker rm -f intensure-ci || true
